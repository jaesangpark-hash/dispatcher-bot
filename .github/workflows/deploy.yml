name: Deploy to EC2

on:
  push:
    branches: [main]
  # 수동 재기동용 — 코드 변경 없이 봇만 재시작할 때 Actions 탭에서 Run workflow (2026-09-07)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest main and restart dispatcher-bot
        run: |
          set -e
          cd /home/dispatcher/app
          git fetch origin
          git checkout main
          git reset --hard origin/main
          sudo systemctl restart dispatcher-bot
          sleep 3
          systemctl is-active dispatcher-bot
