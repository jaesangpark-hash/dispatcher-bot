name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest main and restart dispatcher-bot
        run: |
          set -e
          cd /home/dispatcher/app
          git fetch origin
          git checkout main
          git reset --hard origin/main
          sudo systemctl restart dispatcher-bot
          sleep 3
          systemctl is-active dispatcher-bot
